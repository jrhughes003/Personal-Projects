name: Blackjack Trainer CI

on:
  push:
    branches: [main]
    paths: ['games/blackjack-trainer/**', '.github/workflows/blackjack-trainer-ci.yml']
  pull_request:
    paths: ['games/blackjack-trainer/**', '.github/workflows/blackjack-trainer-ci.yml']

concurrency:
  group: blackjack-trainer-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: games/blackjack-trainer

jobs:
  check:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: games/blackjack-trainer/.nvmrc
          cache: npm
          cache-dependency-path: games/blackjack-trainer/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: games/blackjack-trainer/.nvmrc
          cache: npm
          cache-dependency-path: games/blackjack-trainer/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: games/blackjack-trainer/playwright-report
          retention-days: 7
